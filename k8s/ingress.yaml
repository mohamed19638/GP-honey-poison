apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pump-ingress
  namespace: app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pump-ui
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: pump-api
            port:
              number: 80

