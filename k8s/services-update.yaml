apiVersion: v1
kind: Service
metadata:
  name: pump-api
  namespace: app
spec:
  selector:
    app: pump-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: pump-ui
  namespace: app
spec:
  selector:
    app: pump-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
