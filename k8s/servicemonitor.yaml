apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pump-api-monitor
  namespace: default # المكان اللي فيه بروميثيوس
  labels:
    release: my-prometheus # لازم يكون نفس اسم الـ Helm Release بتاعك
spec:
  selector:
    matchLabels:
      app: pump-api # لازم يطابق الـ Label اللي في الـ Service بتاع الـ API
  namespaceSelector:
    matchNames:
      - app # المكان اللي فيه الـ API بتاعك
  endpoints:
  - port: http # اسم البورت في السيرفيس بتاع الـ API
    path: /metrics # المسار اللي الـ API بيطلع فيه الأرقام
