apiVersion: v1
kind: Service
metadata:
  name: pump-api
  namespace: app
  annotations:
    prometheus.io/scrape: "true"      # علامة لبدء السحب
    prometheus.io/path: "/metrics"   # مكان الداتا
    prometheus.io/port: "8080"      # البورت اللي عليه الداتا
spec:
  selector:
    app: pump-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
