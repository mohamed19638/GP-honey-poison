apiVersion: v1
kind: Namespace
metadata:
  name: splunk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splunk-enterprise
  namespace: splunk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: splunk
  template:
    metadata:
      labels:
        app: splunk
    spec:
      containers:
      - name: splunk
        image: splunk/splunk:latest
        env:
        - name: SPLUNK_GENERAL_TERMS
          value: "--accept-sgt-current-at-splunk-com"
        - name: SPLUNK_START_ARGS
          value: "--accept-license"
        - name: SPLUNK_PASSWORD
          value: "Splunk@123"
        - name: SPLUNK_REDUCE_ALLOCATIONS
          value: "1"
        ports:
        - containerPort: 8000
        - containerPort: 9997
        - containerPort: 8089
        resources:
          limits:
            memory: "4Gi"
            cpu: "2"
          requests:
            memory: "2Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: splunk-service
  namespace: splunk
spec:
  selector:
    app: splunk
  ports:
  - name: ui
    protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30080
  - name: forwarder
    protocol: TCP
    port: 9997
    targetPort: 9997
  type: NodePort
